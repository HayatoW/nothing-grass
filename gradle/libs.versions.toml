[versions]
agp = "8.7.3"
kotlin = "2.0.21"
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version = "2024.12.01" }
material3 = { module = "androidx.compose.material3:material3" }
activity-compose = { module = "androidx.activity:activity-compose", version = "1.9.3" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version = "1.1.1" }
glance-appwidget = { module = "androidx.glance:glance-appwidget", version = "1.1.1" }
work-runtime = { module = "androidx.work:work-runtime-ktx", version = "2.9.1" }
junit = { module = "junit:junit", version = "4.13.2" }
json = { module = "org.json:json", version = "20240303" }
androidx-test-runner = { module = "androidx.test:runner", version = "1.6.2" }
androidx-test-ext = { module = "androidx.test.ext:junit", version = "1.2.1" }
compose-ui-test = { module = "androidx.compose.ui:ui-test-junit4" }
compose-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
